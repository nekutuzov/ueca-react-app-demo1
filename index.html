<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Relative so it resolves against <base> in dev and on GitHub Pages alike -->
  <link rel="icon" type="image/x-icon" href="ueca.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="UECA-React Application Demo - a Material UI application built on UECA-React: CRUD screens, charts, routing, dialogs and interactive tutorials on bindings, the message bus and automatic events." />
  <title>UECA-React Application Demo</title>
  <base href="/ueca-react-app-demo1/" />
  <script>
    // Paint the page in the theme mode the app starts in, before the bundle loads. Without it every
    // reload showed a white page until MUI's CssBaseline arrived - after the mock API worker has
    // started. The html element's background only shows until the body is painted, so it never
    // competes with the theme. Keep the key and the default in step with appThemeManager.tsx; the
    // colours are MUI's default palette.background.default.
    (function () {
      var mode;
      try {
        mode = localStorage.getItem("ueca-demo1-theme-mode");
      } catch (e) { /* private browsing or blocked site data */ }
      document.documentElement.style.background = mode === "light" ? "#ffffff" : "#121212";
    })();
  </script>
  <style>
    html,
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
  </style>
  <script type="module" crossorigin src="/ueca-react-app-demo1/assets/index-C0dZditq.js"></script>
  <link rel="stylesheet" crossorigin href="/ueca-react-app-demo1/assets/index-ed1TwQco.css">
</head>

<body>
  <div id="root" class="main"></div>
</body>

</html>
